format = """
[](fg:#d65d0e)\
[ 󰣇 ](bg:#d65d0e fg:#282828)\
[](bg:#83a598 fg:#d65d0e)\
$directory\
[](fg:#83a598 bg:#504945)\
$git_branch\
$git_status\
[](fg:#504945 bg:#3c3836)\
$nodejs\
$rust\
$golang\
[](fg:#3c3836 bg:#282828)\
$time\
[](fg:#282828 bg:#1d2021)\
$cmd_duration\
[ ](fg:#1d2021)\
\n$character"""

[directory]
style = "fg:#fbf1c7 bg:#83a598"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#504945"
format = '[[ $symbol $branch ](fg:#83a598 bg:#504945)]($style)'

[git_status]
style = "bg:#504945"
format = '[[($all_status$ahead_behind )](fg:#83a598 bg:#504945)]($style)'

[nodejs]
symbol = ""
style = "bg:#3c3836"
format = '[[ $symbol ($version) ](fg:#83a598 bg:#3c3836)]($style)'

[rust]
symbol = ""
style = "bg:#3c3836"
format = '[[ $symbol ($version) ](fg:#83a598 bg:#3c3836)]($style)'

[golang]
symbol = ""
style = "bg:#3c3836"
format = '[[ $symbol ($version) ](fg:#83a598 bg:#3c3836)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#282828"
format = '[[  $time ](fg:#a89984 bg:#282828)]($style)'

[cmd_duration]
min_time = 0
style = "bg:#1d2021"
format = '[[ ⏱ $duration ](fg:#fabd2f bg:#1d2021)]($style)'
show_milliseconds = true

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[✗](bold red)'

